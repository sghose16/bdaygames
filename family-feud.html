// Gemini/Claude version

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Feud</title>
    <style>
        :root {
            --feud-blue: #003399;
            --feud-dark-blue: #001a4d;
            --feud-yellow: #ffcc00;
            --feud-text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            --panel-bg: rgba(0, 0, 0, 0.35);
            --gap: clamp(6px, 1.4vh, 14px);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 50% 30%, var(--feud-blue) 0%, var(--feud-dark-blue) 100%);
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            color: white;
            margin: 0;
            height: 100vh;
            height: 100dvh;
            padding: clamp(8px, 2vh, 20px) 16px clamp(4px, 1vh, 10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
            overflow: hidden;
        }

        /* Every main row shares one width so the layout lines up */
        #scoreboard, #status-line, #question-display, .game-board {
            width: 100%;
            max-width: 1200px;
        }

        /* Scoreboard */
        #scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--gap);
            flex-shrink: 0;
        }

        .team-box, .bank-box {
            background: var(--panel-bg);
            border: 2px solid rgba(255, 204, 0, 0.3);
            border-radius: 10px;
            padding: clamp(4px, 1vh, 10px) 16px;
            text-align: center;
            text-shadow: var(--feud-text-shadow);
            line-height: 1.1;
        }

        .team-box {
            min-width: 0;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .team-box.active {
            border-color: var(--feud-yellow);
            background: rgba(255, 204, 0, 0.12);
            box-shadow: 0 0 16px rgba(255, 204, 0, 0.5);
        }

        .team-name {
            font-size: clamp(1rem, 3vh, 1.6rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .team-score, #round-bank {
            font-size: clamp(1.8rem, 7vh, 3.6rem);
            color: var(--feud-yellow);
        }

        .team-tag {
            display: inline-block;
            font-size: clamp(0.7rem, 1.8vh, 1rem);
            letter-spacing: 2px;
            min-height: 1.6em;
            padding: 0.2em 0.7em;
            border-radius: 999px;
        }

        .team-tag:not(:empty) {
            background: var(--feud-yellow);
            color: var(--feud-dark-blue);
            text-shadow: none;
        }

        .bank-box {
            border-color: var(--feud-yellow);
            min-width: clamp(140px, 20vw, 220px);
        }

        .bank-label {
            font-size: clamp(0.7rem, 1.8vh, 1rem);
            letter-spacing: 3px;
            opacity: 0.8;
        }

        #strikes {
            font-size: clamp(1.1rem, 3.4vh, 1.8rem);
            letter-spacing: 6px;
        }

        .strike-mark {
            color: rgba(255, 255, 255, 0.15);
            transition: color 0.2s;
        }

        .strike-mark.on {
            color: #ff2a2a;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }

        #status-line {
            font-size: clamp(1rem, 2.8vh, 1.5rem);
            color: var(--feud-yellow);
            text-shadow: var(--feud-text-shadow);
            text-align: center;
            min-height: 1.3em;
            flex-shrink: 0;
        }

        /* Question */
        #question-display {
            background: var(--panel-bg);
            border: 2px solid var(--feud-yellow);
            border-radius: 12px;
            padding: clamp(6px, 1.5vh, 14px) 20px;
            text-align: center;
            font-size: clamp(1.3rem, 4.6vh, 2.6rem);
            line-height: 1.25;
            text-shadow: var(--feud-text-shadow);
            flex-shrink: 0;
        }

        /* The Grid fills whatever height is left */
        .game-board {
            flex: 1;
            min-height: 0;
            max-height: 640px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(4, 1fr);
            gap: var(--gap);
        }

        /* Card Container */
        .card {
            min-height: 0;
            cursor: pointer;
            perspective: 1000px;
        }

        /* Inner Card (The flipper) */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        /* Flip State */
        .card.revealed .card-inner {
            transform: rotateX(180deg);
        }

        /* Front and Back common styles */
        .card-front, .card-back {
            position: absolute;
            inset: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            border: 2px solid var(--feud-yellow);
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
        }

        /* Front (The Cover/Number) */
        .card-front {
            background: linear-gradient(180deg, #0a4fd6 0%, #002a80 100%);
            justify-content: center;
            color: var(--feud-yellow);
            font-size: clamp(2rem, 7vh, 3.8rem);
            text-shadow: var(--feud-text-shadow);
        }

        /* Back (The Answer + Score) */
        .card-back {
            background: linear-gradient(180deg, #ffffff 0%, #d9d9d9 100%);
            color: #111;
            transform: rotateX(180deg);
            justify-content: space-between;
            gap: 10px;
            padding: 0 6px 0 16px;
            font-size: clamp(1rem, 3.8vh, 2rem);
            text-transform: uppercase;
        }

        .answer-text {
            text-align: left;
            flex-grow: 1;
            line-height: 1.1;
            overflow: hidden;
        }

        .answer-score {
            background-color: var(--feud-blue);
            color: white;
            padding: 0.2em 0.5em;
            border-radius: 5px;
            min-width: 2.2em;
            text-align: center;
        }

        /* The Red X Overlay */
        #strike-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: min(15em, 40vh);
            color: #ff0000;
            text-shadow:
                0 0 20px rgba(255, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.6),
                0 0 60px rgba(255, 0, 0, 0.4);
            font-weight: bold;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #strike-overlay.active {
            opacity: 1;
        }

        /* Setup + Results overlays */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 40, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 900;
        }

        .overlay.hidden {
            display: none;
        }

        .panel {
            background: linear-gradient(180deg, #0a4fd6 0%, #002a80 100%);
            border: 3px solid var(--feud-yellow);
            border-radius: 14px;
            padding: clamp(16px, 4vh, 32px) clamp(16px, 4vw, 36px);
            width: min(560px, 100%);
            max-height: 100%;
            overflow-y: auto;
            text-align: center;
            text-shadow: var(--feud-text-shadow);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .panel h2 {
            color: var(--feud-yellow);
            font-size: clamp(1.6rem, 5.5vh, 2.6rem);
            margin: 0 0 clamp(10px, 2.5vh, 20px);
        }

        .panel label {
            display: block;
            text-align: left;
            margin-bottom: 14px;
            font-size: 1.05rem;
            letter-spacing: 1px;
        }

        .panel input[type="text"] {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            font-size: 1.35rem;
            font-family: inherit;
            border: 2px solid transparent;
            border-radius: 6px;
            outline: none;
        }

        .panel input[type="text"]:focus {
            border-color: var(--feud-yellow);
        }

        .panel fieldset {
            border: 1px solid rgba(255, 204, 0, 0.5);
            border-radius: 8px;
            text-align: left;
            margin: 0 0 20px;
            padding: 6px 14px 4px;
        }

        .panel legend {
            font-size: 1.05rem;
            letter-spacing: 1px;
            padding: 0 6px;
        }

        .panel fieldset label {
            margin: 6px 0;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .panel input[type="radio"] {
            accent-color: var(--feud-yellow);
        }

        .panel button {
            background: var(--feud-yellow);
            color: var(--feud-dark-blue);
            font-family: inherit;
            font-size: 1.35rem;
            border: 2px solid var(--feud-yellow);
            border-radius: 8px;
            padding: 10px 22px;
            margin: 4px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        .panel button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .panel button.secondary {
            background: transparent;
            color: white;
            border-color: rgba(255, 255, 255, 0.7);
        }

        .results-points {
            font-size: clamp(1.3rem, 4vh, 2rem);
            margin-bottom: clamp(10px, 2.5vh, 20px);
        }

        .results-scores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: clamp(12px, 3vh, 22px);
            font-size: 1.2rem;
        }

        .results-scores > div {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            padding: 8px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Controls hint */
        .controls-hint {
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: clamp(0.75rem, 1.8vh, 0.95rem);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Pre-game Setup -->
    <div id="setup-overlay" class="overlay">
        <div class="panel">
            <h2>FAMILY FEUD</h2>
            <label>Team 1 name
                <input type="text" id="team-input-0" placeholder="Team 1" maxlength="30">
            </label>
            <label>Team 2 name
                <input type="text" id="team-input-1" placeholder="Team 2" maxlength="30">
            </label>
            <fieldset>
                <legend>Who goes first?</legend>
                <label><input type="radio" name="first-team" value="0" checked> <span id="first-label-0">Team 1</span></label>
                <label><input type="radio" name="first-team" value="1"> <span id="first-label-1">Team 2</span></label>
            </fieldset>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <!-- Round Results -->
    <div id="results-overlay" class="overlay hidden">
        <div class="panel">
            <h2 id="results-title"></h2>
            <div class="results-points" id="results-points"></div>
            <div class="results-scores">
                <div><div id="results-name-0"></div><div class="team-score" id="results-score-0">0</div></div>
                <div><div id="results-name-1"></div><div class="team-score" id="results-score-1">0</div></div>
            </div>
            <button class="secondary" id="view-board-btn">View Board</button>
            <button id="next-round-btn">Next Round</button>
        </div>
    </div>

    <div id="scoreboard">
        <div class="team-box" id="team-box-0">
            <div class="team-name" id="team-name-0"></div>
            <div class="team-score" id="team-score-0">0</div>
            <div class="team-tag" id="team-tag-0"></div>
        </div>
        <div class="bank-box">
            <div class="bank-label">ROUND BANK</div>
            <div id="round-bank">0</div>
            <div id="strikes">
                <span class="strike-mark">✖</span><span class="strike-mark">✖</span><span class="strike-mark">✖</span>
            </div>
        </div>
        <div class="team-box" id="team-box-1">
            <div class="team-name" id="team-name-1"></div>
            <div class="team-score" id="team-score-1">0</div>
            <div class="team-tag" id="team-tag-1"></div>
        </div>
    </div>

    <div id="status-line"></div>

    <div id="question-display">Loading Question...</div>

    <div class="game-board" id="board">
        <!-- Cards will be generated by JS -->
    </div>

    <!-- Strike Overlay -->
    <div id="strike-overlay">
        <div class="big-x">✖</div>
    </div>

    <div class="controls-hint">
        Keys: [Space] Show Question | [1-8] or click = Correct Answer | [X] Wrong Answer | [T] or click team = Switch Team | [Right Arrow] Next Round | [Left Arrow] Prev Round
    </div>

    <script>
        // --- CONFIGURATION: HARDCODE YOUR ANSWERS HERE ---
        const gameData = [
            {
                question: "A cop pulls you over for speeding. What's an excuse you can give to get out of a ticket:",
                answers: [
                    { text: "Emergency/Hospital", points: 40 },
                    { text: "Gotta potty", points: 29 },
                    { text: "Didn't realize", points: 15 },
                    { text: "Late for work", points: 7 },
                    { text: "Gas pedal stuck", points: 2 },
                    { text: "Date night/Anniversary", points: 2 },
                ]
            },
            {
                question: "What zoo animal's enclosure would you least like to fall into?",
                answers: [
                    { text: "Lion", points: 27 },
                    { text: "Tiger", points: 19 },
                    { text: "Gorilla", points: 18 },
                    { text: "Bear", points: 14 },
                    { text: "Hippo", points: 10 },
                    { text: "Crocodile", points: 5 },
                    { text: "Snake", points: 4 },
                    { text: "Shark", points: 4 }
                ]
            },
            {
                question: "Name something that only happens every few years.",
                answers: [
                    { text: "Leap Year", points: 43 },
                    { text: "Eclipse", points: 22 },
                    { text: "Olympics", points: 16 },
                    { text: "Presidential Election", points: 13 },
                ]
            },
            { 
                question: "Name a game that would be inappropriate at a company party.", 
                answers: [
                    { text: "Spin the Bottle", points: 41 },
                    { text: "Strip Poker", points: 32 },
                    { text: "Twister", points: 11 },
                    { text: "Truth or Dare", points: 11 },
                    { text: "Beer Pong", points: 3 },
                ]
            },
            { 
                question: "Name something that might be brewing.", 
                answers: [
                    { text: "Coffee", points: 37 },
                    { text: "Beer", points: 28 },
                    { text: "Tea", points: 17 },
                    { text: "Trouble", points: 8 },
                    { text: "A storm", points: 5 },
                    { text: "A plot", points: 3 },
                ]
            },                   
            { 
                question: "Name something associated with vampires.", 
                answers: [
                    { text: "Twilight", points: 33 },
                    { text: "Blood/Sucking Blood", points: 29 },
                    { text: "Garlic", points: 9 },
                    { text: "Bat", points: 7 },
                    { text: "Cape", points: 7 },
                    { text: "Dracula", points: 5 },
                    { text: "Fangs", points: 4 },
                    { text: "Halloween", points: 4 }
                ]
            },
                        {
                question: "Name something people try to squeeze into.",
                answers: [
                    { text: "Tight clothes/shoes", points: 84 },
                    { text: "Parking spot", points: 3 },
                    { text: "Crowded bus", points: 2 },
                    { text: "Dining booth", points: 2 },
                ]
            },
            { 
                question: "Name an occasion where parents force their kids to wear a certain outfit", 
                answers: [
                    { text: "Wedding", points: 26},
                    { text: "Easter", points: 23 },
                    { text: "Halloween", points: 20 },
                    { text: "Church", points: 15 },
                    { text: "Christmas", points: 4 },
                    { text: "School Picture Day", points: 4 },
                ]
            },
            { 
                question: "Name a place that's filled with people who don't want to be there.",
                answers: [
                    { text: "Jail/Prison", points: 36 },
                    { text: "Hell", points: 10},
                    { text: "Work/meetings", points: 10 },
                    { text: "Cemetery", points: 8 },
                    { text: "Church", points: 8 },
                ]
            },
            { 
                question: "Name something you stuff as much as you can.", 
                answers: [
                    { text: "Turkey", points: 39 },
                    { text: "Trash Cans", points: 14 },
                    { text: "Christmas Stockings", points: 6 },
                    { text: "Suitcase", points: 6 },
                    { text: "Pillow", points: 6 },
                    { text: "Teddy Bear", points: 5 },
                    { text: "Purse", points: 5 },
                    { text: "Stomach", points: 4 }
                ]
            },
        ];

        let currentRoundIndex = 0;
        const board = document.getElementById('board');
        const questionDisplay = document.getElementById('question-display');
        const strikeOverlay = document.getElementById('strike-overlay');
        const setupOverlay = document.getElementById('setup-overlay');
        const resultsOverlay = document.getElementById('results-overlay');
        const statusLine = document.getElementById('status-line');
        let questionRevealed = false;

        // --- SCORING STATE ---
        const teams = [
            { name: 'Team 1', score: 0 },
            { name: 'Team 2', score: 0 }
        ];
        let firstTeam = 0;          // team chosen to go first at setup
        let phase = 'setup';        // setup | faceoff | play | steal | resolved
        let roundBank = 0;
        let strikes = 0;
        let controlTeam = null;     // team playing the board
        let faceoff = null;         // { turn, picks: [teamA, teamB] } pick = answer index, -1 = miss, null = not yet
        let faceoffNote = '';
        let scoredAnswers = new Set();
        const roundResults = {};    // roundIndex -> { winner, points } (prevents double-awarding)

        // Face-off starter alternates each round, beginning with the team chosen at setup
        function faceoffStarter() {
            return (firstTeam + currentRoundIndex) % 2;
        }

        // Initialize Game
        function loadRound(index) {
            // Bounds check
            if (index < 0) index = 0;
            if (index >= gameData.length) index = gameData.length - 1;
            currentRoundIndex = index;
            questionRevealed = false;

            const roundData = gameData[currentRoundIndex];
            questionDisplay.textContent = `Round ${currentRoundIndex + 1}`;
            board.innerHTML = ''; // Clear board

            // Create 8 slots (even if fewer answers exist, we keep the grid structure)
            for (let i = 0; i < 8; i++) {
                const answerData = roundData.answers[i];
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i; // Store index for click handling

                // If there is data for this slot
                if (answerData) {
                    card.innerHTML = `
                        <div class="card-inner">
                            <div class="card-front">${i + 1}</div>
                            <div class="card-back">
                                <span class="answer-text">${answerData.text}</span>
                                <span class="answer-score">${answerData.points}</span>
                            </div>
                        </div>
                    `;

                    // Click = mark correct
                    card.addEventListener('click', () => markCorrect(i));
                } else {
                    // Empty slot styling (optional: hide number or keep it static)
                    card.innerHTML = `
                        <div class="card-inner">
                            <div class="card-front" style="opacity: 0.3; cursor: default;"></div>
                            <div class="card-back"></div>
                        </div>
                    `;
                }
                board.appendChild(card);
            }

            // Reset per-round scoring state (cumulative scores are preserved)
            roundBank = 0;
            strikes = 0;
            controlTeam = null;
            faceoffNote = '';
            scoredAnswers = new Set();
            resultsOverlay.classList.add('hidden');

            if (roundResults[currentRoundIndex]) {
                phase = 'resolved'; // already awarded; board is display-only
            } else {
                phase = 'faceoff';
                faceoff = { turn: faceoffStarter(), picks: [null, null] };
            }
            updateUI();
        }

        function toggleReveal(cardElement) {
            // Only toggle if it has content (checked by class existence in innerHTML logic)
            if(cardElement.querySelector('.answer-text')) {
                cardElement.classList.toggle('revealed');
            }
        }

        // Game master marks answer #i as correct
        function markCorrect(i) {
            const answers = gameData[currentRoundIndex].answers;
            const card = document.querySelectorAll('.card')[i];
            if (!answers[i] || !card || phase === 'setup') return;

            // After the round is decided, answers can be flipped for show without scoring
            if (phase === 'resolved') {
                toggleReveal(card);
                return;
            }

            if (scoredAnswers.has(i)) return; // never score the same answer twice
            scoredAnswers.add(i);
            card.classList.add('revealed');
            roundBank += answers[i].points;
            const allRevealed = scoredAnswers.size === answers.length;

            if (phase === 'faceoff') {
                faceoff.picks[faceoff.turn] = i;
                faceoffNote = '';
                if (i === 0 || allRevealed) {
                    winControl(faceoff.turn); // top answer wins the face-off outright
                } else {
                    advanceFaceoff();
                }
            } else if (phase === 'play') {
                if (allRevealed) {
                    resolveRound(controlTeam);
                } else {
                    updateUI();
                }
            } else if (phase === 'steal') {
                resolveRound(1 - controlTeam);
            }
        }

        // Game master marks the current guess as wrong
        function markWrong() {
            if (phase === 'setup') return;
            showStrike();

            if (phase === 'faceoff') {
                faceoff.picks[faceoff.turn] = -1;
                faceoffNote = '';
                advanceFaceoff();
            } else if (phase === 'play') {
                strikes = Math.min(strikes + 1, 3);
                if (strikes === 3) phase = 'steal';
                updateUI();
            } else if (phase === 'steal') {
                resolveRound(controlTeam);
            }
        }

        function advanceFaceoff() {
            const other = 1 - faceoff.turn;
            if (faceoff.picks[other] === null) {
                faceoff.turn = other; // other team's chance to answer
                updateUI();
                return;
            }

            const [a, b] = faceoff.picks;
            if (a === -1 && b === -1) {
                // Nobody found an answer: run the face-off again
                faceoff = { turn: faceoffStarter(), picks: [null, null] };
                faceoffNote = ' (both missed — face-off again)';
                updateUI();
                return;
            }

            let winner;
            if (a === -1) winner = 1;
            else if (b === -1) winner = 0;
            else winner = a < b ? 0 : 1; // lower index = higher-ranked answer
            winControl(winner);
        }

        function winControl(team) {
            controlTeam = team;
            strikes = 0;
            if (scoredAnswers.size === gameData[currentRoundIndex].answers.length) {
                resolveRound(team);
                return;
            }
            phase = 'play';
            updateUI();
        }

        function resolveRound(winner) {
            if (roundResults[currentRoundIndex]) return; // guard against double-awarding
            const points = roundBank;
            teams[winner].score += points;
            roundResults[currentRoundIndex] = { winner, points };
            roundBank = 0;
            phase = 'resolved';
            updateUI();
            const round = currentRoundIndex;
            setTimeout(() => { // let the flip / X play first
                if (currentRoundIndex === round) showResults(winner, points);
            }, 1200);
        }

        function showResults(winner, points) {
            document.getElementById('results-title').textContent = `${teams[winner].name} wins the round!`;
            document.getElementById('results-points').textContent = `+${points} points`;
            for (let t = 0; t < 2; t++) {
                document.getElementById(`results-name-${t}`).textContent = teams[t].name;
                document.getElementById(`results-score-${t}`).textContent = teams[t].score;
            }
            const isLast = currentRoundIndex === gameData.length - 1;
            const nextBtn = document.getElementById('next-round-btn');
            nextBtn.style.display = isLast ? 'none' : '';
            if (isLast) {
                const [s0, s1] = [teams[0].score, teams[1].score];
                document.getElementById('results-points').textContent +=
                    s0 === s1 ? ' — Game over: it\'s a tie!' : ` — Game over: ${teams[s0 > s1 ? 0 : 1].name} wins!`;
            }
            resultsOverlay.classList.remove('hidden');
        }

        function updateUI() {
            const stealTeam = controlTeam === null ? null : 1 - controlTeam;
            for (let t = 0; t < 2; t++) {
                document.getElementById(`team-name-${t}`).textContent = teams[t].name;
                document.getElementById(`team-score-${t}`).textContent = teams[t].score;

                let tag = '';
                if (phase === 'faceoff' && faceoff.turn === t) tag = 'FACE-OFF';
                if ((phase === 'play' || phase === 'steal') && controlTeam === t) tag = 'CONTROL';
                if (phase === 'steal' && stealTeam === t) tag = 'STEALING';
                document.getElementById(`team-tag-${t}`).textContent = tag;

                const active = (phase === 'faceoff' && faceoff.turn === t) ||
                               (phase === 'play' && controlTeam === t) ||
                               (phase === 'steal' && stealTeam === t);
                document.getElementById(`team-box-${t}`).classList.toggle('active', active);
            }

            document.getElementById('round-bank').textContent = roundBank;
            document.querySelectorAll('.strike-mark').forEach((mark, i) => {
                mark.classList.toggle('on', i < strikes);
            });

            let status = '';
            if (phase === 'faceoff') {
                status = `FACE-OFF: ${teams[faceoff.turn].name} answering${faceoffNote}`;
            } else if (phase === 'play') {
                status = `${teams[controlTeam].name} has control — ${strikes} strike${strikes === 1 ? '' : 's'}`;
            } else if (phase === 'steal') {
                status = `3 STRIKES! ${teams[stealTeam].name} can steal: [1-8] if correct, [X] if wrong`;
            } else if (phase === 'resolved' && roundResults[currentRoundIndex]) {
                const r = roundResults[currentRoundIndex];
                status = `${teams[r.winner].name} won this round (+${r.points})`;
            }
            statusLine.textContent = status;
        }

        // Game master override: make team t the one getting the points
        function switchTeam(t) {
            if (phase === 'setup') return;

            if (phase === 'faceoff') {
                faceoff.turn = t; // change who is answering the face-off
            } else if (phase === 'play' || phase === 'steal') {
                controlTeam = t;  // the team in control gets the bank (stealing team becomes the other one)
            } else if (phase === 'resolved') {
                // Move an already-awarded round's points to the other team
                const r = roundResults[currentRoundIndex];
                if (!r || r.winner === t) return;
                teams[r.winner].score -= r.points;
                teams[t].score += r.points;
                r.winner = t;
                if (!resultsOverlay.classList.contains('hidden')) showResults(t, r.points);
            }
            updateUI();
        }

        // Which team T should switch to
        function otherTeam() {
            if (phase === 'faceoff') return 1 - faceoff.turn;
            if (phase === 'resolved') {
                const r = roundResults[currentRoundIndex];
                return r ? 1 - r.winner : null;
            }
            return 1 - controlTeam;
        }

        [0, 1].forEach(t => {
            document.getElementById(`team-box-${t}`).addEventListener('click', () => switchTeam(t));
        });

        const strikeSound = new Audio('/Users/swetag/Downloads/error-sound.mp3');
        strikeSound.preload = 'auto';

        function showStrike() {
            strikeOverlay.classList.add('active');
            strikeSound.currentTime = 0; // Reset to start
            strikeSound.play();
            setTimeout(() => {
                strikeOverlay.classList.remove('active');
            }, 1000); // Shows for 1 seconds
        }

        // Leaving an unfinished round with points in the bank needs confirmation
        function changeRound(delta) {
            const target = currentRoundIndex + delta;
            if (target < 0 || target >= gameData.length) return;
            if (phase !== 'resolved' && roundBank > 0 &&
                !confirm(`The round bank (${roundBank}) hasn't been awarded. Leave this round anyway?`)) {
                return;
            }
            loadRound(target);
        }

        // --- SETUP SCREEN ---
        const teamInputs = [document.getElementById('team-input-0'), document.getElementById('team-input-1')];
        teamInputs.forEach((input, t) => {
            input.addEventListener('input', () => {
                document.getElementById(`first-label-${t}`).textContent = input.value.trim() || `Team ${t + 1}`;
            });
        });

        function startGame() {
            teams[0].name = teamInputs[0].value.trim() || 'Team 1';
            teams[1].name = teamInputs[1].value.trim() || 'Team 2';
            firstTeam = parseInt(document.querySelector('input[name="first-team"]:checked').value);
            setupOverlay.classList.add('hidden');
            loadRound(0);
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('view-board-btn').addEventListener('click', () => resultsOverlay.classList.add('hidden'));
        document.getElementById('next-round-btn').addEventListener('click', () => changeRound(1));

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            // Setup screen: let the game master type; Enter starts
            if (phase === 'setup') {
                if (key === 'enter') startGame();
                return;
            }

            // T = switch team (works on results screen too, to fix who got the points)
            if (key === 't') {
                const t = otherTeam();
                if (t !== null) switchTeam(t);
                return;
            }

            // Results screen: Enter / Right Arrow = next round, Escape = view board
            if (!resultsOverlay.classList.contains('hidden')) {
                if (key === 'enter' || key === 'arrowright') changeRound(1);
                if (key === 'escape') resultsOverlay.classList.add('hidden');
                return;
            }

            if ((e.code === 'Space' || key === ' ') && !questionRevealed) {
                questionDisplay.textContent = gameData[currentRoundIndex].question;
                questionRevealed = true;
                return;
            }

            // 1. Number Keys (1-8) = correct answer
            if (key >= '1' && key <= '8') {
                markCorrect(parseInt(key) - 1);
            }

            // 2. 'x' for Strike
            if (key === 'x') {
                markWrong();
            }

            // 3. Navigation (Arrow Keys)
            if (key === 'arrowright') {
                changeRound(1);
            }
            if (key === 'arrowleft') {
                changeRound(-1);
            }
        });

        // Show team names (blank scoreboard) behind the setup screen
        updateUI();

    </script>
</body>
</html>
